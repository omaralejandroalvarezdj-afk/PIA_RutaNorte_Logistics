<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RutaNorte Logistics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>body{font-family:Inter,system-ui,sans-serif}[role=tab][aria-selected=true]{color:#1d5fd8;border-color:#1d5fd8}</style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col">
  <header class="bg-slate-900 text-white sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-blue-600 grid place-items-center font-extrabold">R</div>
        <span class="font-extrabold tracking-tight">RutaNorte <span class="text-blue-300 font-semibold">Logistics</span></span>
      </div>
      <a href="/docs" target="_blank" class="text-sm text-blue-200 hover:text-white">Swagger / OpenAPI ↗</a>
    </div>
  </header>

  <nav class="bg-white border-b border-slate-200 sticky top-16 z-10">
    <div role="tablist" class="max-w-6xl mx-auto px-4 flex gap-1 overflow-x-auto">
      <button role="tab" data-tab="cotizar" class="px-4 py-3.5 text-sm font-semibold border-b-2 border-transparent whitespace-nowrap">Cotizar / Reservar</button>
      <button role="tab" data-tab="envio" class="px-4 py-3.5 text-sm font-semibold border-b-2 border-transparent whitespace-nowrap">Mi Envío</button>
      <button role="tab" data-tab="operaciones" class="px-4 py-3.5 text-sm font-semibold border-b-2 border-transparent whitespace-nowrap">Operaciones / Sucursal</button>
      <button role="tab" data-tab="indicadores" class="px-4 py-3.5 text-sm font-semibold border-b-2 border-transparent whitespace-nowrap">Indicadores</button>
    </div>
  </nav>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
    <section id="panel-cotizar" data-panel hidden></section>
    <section id="panel-envio" data-panel hidden></section>
    <section id="panel-operaciones" data-panel hidden></section>
    <section id="panel-indicadores" data-panel hidden></section>
  </main>

  <div id="toast" class="fixed bottom-6 right-6 max-w-sm hidden rounded-xl bg-slate-900 text-white text-sm px-4 py-3 shadow-xl"></div>

  <footer class="border-t border-slate-200 bg-white py-5 text-center text-sm text-slate-500">
    Proyecto Equipo #2, Grupo 003, FIME UANL.
  </footer>
  <script type="module" src="/js/main.js"></script>
</body>
</html>

services:
  - type: web
    name: rutanorte
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rutanorte-db
          property: connectionString
      - key: SEED_DEMO
        value: "1"

databases:
  - name: rutanorte-db
    plan: free
    

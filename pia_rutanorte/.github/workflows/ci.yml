name: CI RutaNorte Logistics

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pruebas unitarias, de integración y cobertura (>=80%)
        run: python -m pytest -v --cov=src --cov-report=term-missing --cov-fail-under=80

name: CI RutaNorte Logistics

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  tests:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar pytest con cobertura
        run: |
          python -m pytest -v --cov=src --cov-report=term-missing --cov-fail-under=80

  quality:
    name: Calidad del codigo con Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Ruff
        run: python -m pip install "ruff>=0.9,<1"

      - name: Revisar errores criticos
        run: python -m ruff check --select E9,F63,F7,F82 src tests

  docker:
    name: Validar Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Validar configuracion Docker
        run: docker compose config --quiet

